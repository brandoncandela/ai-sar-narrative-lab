<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-label="A SAR draft whose citation chips link to the alerts that support them, with a passing rule check badge">
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef1fd"/></linearGradient>
  <linearGradient id="ultra" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ea2f4"/><stop offset="1" stop-color="#3b5bdb"/></linearGradient>
  <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b5bdb"/><stop offset="1" stop-color="#8ea2f4"/></linearGradient>
  <radialGradient id="glowA" cx=".18" cy=".12" r=".6"><stop offset="0" stop-color="#5aa9ff" stop-opacity=".42"/><stop offset="1" stop-color="#5aa9ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB" cx=".92" cy=".88" r=".6"><stop offset="0" stop-color="#8b93ff" stop-opacity=".42"/><stop offset="1" stop-color="#8b93ff" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e3a8a" flood-opacity=".10"/></filter>
</defs>
<style>
  text { font-family: Inter, -apple-system, "Segoe UI", sans-serif; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .flow { stroke-dasharray: 6 9; animation: flow 1.4s linear infinite; }
  .flow-slow { stroke-dasharray: 3 7; animation: flow 2.6s linear infinite; }
  .caret { animation: blink 1.1s steps(1) infinite; }
  .ring { stroke-dasharray: 145 200; animation: spin 6s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { transform: scale(1.22); opacity: .55; } }
  @keyframes flow { to { stroke-dashoffset: -30; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="560" height="440" rx="28" fill="url(#panel)"/>
<rect width="560" height="440" rx="28" fill="url(#glowA)"/>
<rect width="560" height="440" rx="28" fill="url(#glowB)"/>
<rect x=".5" y=".5" width="559" height="439" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".9"/>

<!-- label card -->
<rect x="28" y="24" width="232" height="60" rx="16" fill="#fff" fill-opacity=".86" stroke="#1d1d1f" stroke-opacity=".06" filter="url(#soft)"/>
<text x="46" y="49" font-size="14" font-weight="700" fill="#1d1d1f">Narrative draft · CASE-0033</text>
<text x="46" y="68" font-size="11" font-weight="500" fill="#55555d">Every sentence cites its evidence</text>

<!-- glass draft card -->
<rect x="28" y="100" width="300" height="236" rx="18" fill="#fff" fill-opacity=".8" stroke="#ffffff" filter="url(#soft)"/>
<text x="48" y="128" font-size="10.5" font-weight="700" fill="#3b5bdb" letter-spacing=".6">WHY IT IS SUSPICIOUS</text>
<rect x="48" y="144" width="252" height="8" rx="4" fill="#1d1d1f" fill-opacity=".13"/>
<rect x="48" y="161" width="218" height="8" rx="4" fill="#1d1d1f" fill-opacity=".13"/>
<rect x="48" y="178" width="112" height="8" rx="4" fill="#1d1d1f" fill-opacity=".13"/>
<rect x="164" y="171" width="66" height="22" rx="11" fill="#3b5bdb" fill-opacity=".18" class="pulse"/>
<rect x="166" y="173" width="62" height="18" rx="7" fill="#3b5bdb"/>
<text x="197" y="186" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">LEG-01581</text>
<rect x="234" y="173" width="62" height="18" rx="7" fill="#edf0fd"/>
<text x="265" y="186" font-size="10" font-weight="700" fill="#2c45b0" text-anchor="middle">LEG-00739</text>

<rect x="48" y="210" width="240" height="8" rx="4" fill="#1d1d1f" fill-opacity=".13"/>
<rect x="48" y="227" width="146" height="8" rx="4" fill="#1d1d1f" fill-opacity=".13"/>
<rect x="198" y="220" width="54" height="18" rx="7" fill="#edf0fd"/>
<text x="225" y="233" font-size="10" font-weight="700" fill="#2c45b0" text-anchor="middle">FR-4523</text>

<rect x="48" y="255" width="226" height="8" rx="4" fill="#1d1d1f" fill-opacity=".13"/>
<rect x="48" y="272" width="84" height="8" rx="4" fill="#1d1d1f" fill-opacity=".13"/>
<rect x="136" y="266" width="2" height="16" rx="1" fill="#3b5bdb" class="caret"/>

<g font-size="10.5" font-weight="600">
  <rect x="48" y="298" width="74" height="22" rx="11" fill="#2f7d4f" fill-opacity=".12"/>
  <text x="85" y="313" fill="#2f7d4f" text-anchor="middle">✓ amount</text>
  <rect x="128" y="298" width="60" height="22" rx="11" fill="#2f7d4f" fill-opacity=".12"/>
  <text x="158" y="313" fill="#2f7d4f" text-anchor="middle">✓ date</text>
  <rect x="194" y="298" width="76" height="22" rx="11" fill="#2f7d4f" fill-opacity=".12"/>
  <text x="232" y="313" fill="#2f7d4f" text-anchor="middle">✓ citation</text>
</g>

<!-- links from chips to evidence -->
<path d="M228 182 C 300 182, 318 140, 368 140" fill="none" stroke="url(#wire)" stroke-width="2.5" stroke-linecap="round" class="flow"/>
<path d="M296 182 C 336 196, 338 214, 368 222" fill="none" stroke="#8ea2f4" stroke-width="1.6" stroke-linecap="round" class="flow-slow"/>
<path d="M252 229 C 312 240, 330 296, 368 304" fill="none" stroke="#8ea2f4" stroke-width="1.6" stroke-linecap="round" class="flow-slow"/>

<!-- evidence nodes -->
<text x="372" y="96" font-size="10.5" font-weight="700" fill="#86868b" letter-spacing=".6">EVIDENCE PACKET</text>
<circle cx="368" cy="140" r="12" fill="#3b5bdb" fill-opacity=".16" class="pulse"/>
<rect x="368" y="108" width="164" height="64" rx="14" fill="#fff" stroke="#3b5bdb" stroke-width="2" filter="url(#soft)"/>
<text x="384" y="129" font-size="10" font-weight="700" fill="#2c45b0">LEG-01581</text>
<text x="384" y="149" font-size="16" font-weight="800" fill="#1d1d1f">$6,452.00</text>
<text x="384" y="164" font-size="10" fill="#55555d">Apr 13, 2026 · high risk wires</text>
<rect x="368" y="190" width="164" height="64" rx="14" fill="#fff" fill-opacity=".9" filter="url(#soft)"/>
<text x="384" y="211" font-size="10" font-weight="700" fill="#2c45b0">LEG-00739</text>
<text x="384" y="231" font-size="16" font-weight="800" fill="#1d1d1f">$1,941.00</text>
<text x="384" y="246" font-size="10" fill="#55555d">Oct 15, 2026 · funnel deposits</text>
<rect x="368" y="272" width="164" height="64" rx="14" fill="#fff" fill-opacity=".9" filter="url(#soft)"/>
<text x="384" y="293" font-size="10" font-weight="700" fill="#2c45b0">FR-4523</text>
<text x="384" y="313" font-size="16" font-weight="800" fill="#1d1d1f">$1,974.00</text>
<text x="384" y="328" font-size="10" fill="#55555d">Jun 4, 2026 · est. exposure</text>

<!-- rule check badge -->
<g id="badge">
  <rect x="300" y="356" width="232" height="60" rx="16" fill="#fff" fill-opacity=".88" stroke="#1d1d1f" stroke-opacity=".06" filter="url(#soft)"/>
  <circle cx="330" cy="386" r="16" fill="none" stroke="#2f7d4f" stroke-opacity=".15" stroke-width="4"/>
  <circle cx="330" cy="386" r="16" fill="none" stroke="#2f7d4f" stroke-width="4" stroke-linecap="round" class="ring"/>
  <text x="330" y="391" font-size="13" font-weight="800" fill="#2f7d4f" text-anchor="middle">✓</text>
  <text x="356" y="382" font-size="14" font-weight="800" fill="#1d1d1f">7 hard checks</text>
  <text x="356" y="400" font-size="11" font-weight="500" fill="#55555d">run on every draft</text>
</g>
<rect x="28" y="356" width="256" height="60" rx="16" fill="#fff" fill-opacity=".86" stroke="#1d1d1f" stroke-opacity=".06" filter="url(#soft)"/>
<text x="46" y="381" font-size="14" font-weight="800" fill="#3b5bdb">Human review</text>
<text x="46" y="400" font-size="11" font-weight="500" fill="#55555d">Accept, edit or reject with a reason</text>
</svg>
